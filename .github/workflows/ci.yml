name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,real]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy
      - name: Tests
        run: python -m pytest

  chaos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev,real]"
      - name: Recover from 150 injected process exits
        run: python -m bench.chaos --n 150
